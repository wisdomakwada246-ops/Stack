<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Stack Visualizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        .stack-box {
            border: 2px solid #ccc;
            border-top: none;
            height: 250px;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            padding: 10px;
            gap: 5px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .stack-item {
            background: #3498db;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            width: 80%;
            text-align: center;
            font-weight: bold;
            animation: fadeIn 0.3s ease-in-out;
        }
        .stack-item:last-child {
            background: #e74c3c; /* Highlights the top element */
        }
        input, button {
            padding: 8px;
            margin: 5px;
            font-size: 14px;
        }
        input {
            width: 60%;
        }
        button {
            cursor: pointer;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #27ae60;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Stack Visualizer</h2>
    <div id="stackContainer" class="stack-box"></div>
   
    <input type="text" id="itemInput" placeholder="Enter value...">
    <div>
        <button onclick="pushItem()">Push</button>
        <button onclick="popItem()">Pop</button>
        <button onclick="peekItem()">Peek</button>
    </div>
</div>

<script>
    class Stack {
        constructor() {
            this.items = [];
        }
        push(element) {
            this.items.push(element);
        }
        pop() {
            if (this.isEmpty()) return null;
            return this.items.pop();
        }
        peek() {
            if (this.isEmpty()) return null;
            return this.items[this.items.length - 1];
        }
        isEmpty() {
            return this.items.length === 0;
        }
        getItems() {
            return this.items;
        }
    }

    const myStack = new Stack();
    // Seed initial items
    myStack.push("Item 1");
    myStack.push("Item 2");
    renderStack();

    function renderStack() {
        const container = document.getElementById("stackContainer");
        container.innerHTML = "";
        const items = myStack.getItems();

        items.forEach(item => {
            const div = document.createElement("div");
            div.className = "stack-item";
            div.textContent = item;
            container.appendChild(div);
        });
    }

    function pushItem() {
        const input = document.getElementById("itemInput");
        if (input.value.trim() === "") return;
        myStack.push(input.value);
        input.value = "";
        renderStack();
    }

    function popItem() {
        if (myStack.isEmpty()) {
            alert("Stack Underflow: Stack is empty!");
            return;
        }
        myStack.pop();
        renderStack();
    }

    function peekItem() {
        if (myStack.isEmpty()) {
            alert("Stack is empty!");
            return;
        }
        alert("The top element is: " + myStack.peek());
    }
</script>

</body>
</html>
